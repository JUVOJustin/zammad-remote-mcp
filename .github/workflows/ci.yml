name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

  test:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 20 reached end of life in April 2026. `engines` still allows
        # >=20.12 because nothing in the shipped code needs more than
        # process.loadEnvFile, but it is no longer exercised here.
        node-version: [22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  integration:
    # The suite that talks to a real Zammad. Unit tests prove we send what we
    # meant to; only this proves Zammad agrees — selector operators, name
    # resolution, and the mention callback that the @@ rewrite depends on.
    needs: quality
    runs-on: ubuntu-latest
    # A first boot migrates and seeds the database, so this is minutes rather
    # than seconds. The default 360 would fail the job on a slow runner.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Zammad
        run: ./test/integration/up.sh

      - name: Integration tests
        run: npm run test:integration

      - name: Container logs on failure
        if: failure()
        run: docker compose -f test/integration/docker-compose.yml logs --tail 100

      - name: Tear down
        if: always()
        run: ./test/integration/down.sh

  docker:
    # The image is a deployment artefact like the Worker: if it stops building
    # or stops starting, that is only visible here.
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t zammad-remote-mcp:ci .

      - name: Start it and check /health
        run: |
          docker run -d --name zmcp -p 3000:3000 \
            -e ZAMMAD_URL=https://zammad.invalid \
            -e ZAMMAD_AUTH_MODE=token \
            -e ZAMMAD_API_TOKEN=ci \
            zammad-remote-mcp:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "never became healthy"
          docker logs zmcp
          exit 1

      - name: Stop it gracefully
        # A container that only dies on SIGKILL takes the full stop timeout on
        # every deploy; exec-form CMD plus the server's SIGTERM handler is what
        # avoids that, and this is what proves it still holds.
        run: |
          docker stop --timeout 10 zmcp
          code=$(docker inspect zmcp --format '{{.State.ExitCode}}')
          echo "exit code: $code"
          test "$code" = "0"

  worker:
    # The core claims to run unchanged on the edge; this is what keeps that
    # honest. A Node built-in creeping back into src/core fails here, not in a
    # deployment.
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Cloudflare Worker
        # build:worker links this checkout into the example before building, so
        # the job exercises the code in the PR rather than the last release.
        run: npm run build:worker
