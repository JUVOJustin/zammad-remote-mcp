name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

  test:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 20 reached end of life in April 2026. `engines` still allows
        # >=20.12 because nothing in the shipped code needs more than
        # process.loadEnvFile, but it is no longer exercised here.
        node-version: [22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  worker:
    # The core claims to run unchanged on the edge; this is what keeps that
    # honest. A Node built-in creeping back into src/core fails here, not in a
    # deployment.
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Cloudflare Worker
        run: npm run build:worker
