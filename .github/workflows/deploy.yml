name: Deploy

on:
  push:
    tags:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      # Trusted publishing: npm authenticates this workflow over OIDC instead of
      # a long-lived token, and generates provenance automatically because the
      # repository is public.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure an npm that speaks OIDC
        # Trusted publishing needs npm >= 11.5.1. Which npm ships with Node 24
        # moves over time, so pin the floor rather than hope.
        run: npm install -g npm@^11.5.1

      - name: Extract tag version
        id: version
        run: |
          RAW="${GITHUB_REF#refs/tags/}"
          CLEAN="${RAW#v}"
          echo "RAW=$RAW" >> $GITHUB_OUTPUT
          echo "VERSION=$CLEAN" >> $GITHUB_OUTPUT
          if [[ "$CLEAN" =~ -[A-Za-z0-9]+ ]]; then
            echo "NPM_TAG=next" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "NPM_TAG=latest" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Update package.json version
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Start Zammad for the integration suite
        run: ./test/integration/up.sh

      - name: Integration tests
        # Publishing is irreversible, so the tests that talk to a real Zammad
        # run before it rather than only on push.
        run: npm run test:integration

      - name: Container logs on failure
        if: failure()
        run: docker compose -f test/integration/docker-compose.yml logs --tail 100

      - name: Tear down Zammad
        if: always()
        run: ./test/integration/down.sh

      - name: Build the Cloudflare Worker
        # The core claims to run unchanged on the edge. A Node built-in creeping
        # into it fails here rather than in a deployment.
        run: npm run build:worker

      - name: Commit version update
        uses: test-room-7/action-update-file@v1
        with:
          file-path: |
            package.json
            package-lock.json
          commit-msg: "chore: update package.json version to ${{ steps.version.outputs.VERSION }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        # No NODE_AUTH_TOKEN: the npm CLI detects the OIDC environment and
        # exchanges the short-lived GitHub token for publish rights itself.
        run: npm publish --tag ${{ steps.version.outputs.NPM_TAG }}

      - name: Take the release notes from the changelog
        # The generated pull-request list says what merged, not what it means for
        # someone upgrading. This pulls the section for the tag out of
        # CHANGELOG.md and lets the generated list follow underneath. A tag with
        # no section still releases — with the generated list alone, which is
        # what happened before this step existed.
        id: notes
        run: |
          VERSION='${{ steps.version.outputs.VERSION }}'
          if [ -f CHANGELOG.md ] && awk -v v="## $VERSION" '$0 == v {found=1} END {exit !found}' CHANGELOG.md; then
            awk -v v="## $VERSION" '
              $0 == v {inside=1; next}
              inside && /^## / {exit}
              inside {print}
            ' CHANGELOG.md > RELEASE_NOTES.md
            echo "PATH=RELEASE_NOTES.md" >> $GITHUB_OUTPUT
          else
            echo "No CHANGELOG.md section for $VERSION; using the generated notes alone." >&2
            echo "PATH=" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.RAW }}
          body_path: ${{ steps.notes.outputs.PATH }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}
